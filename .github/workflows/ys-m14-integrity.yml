name: Ys source integrity (M13–M16)

on:
  push:
    branches: [Ys]
  pull_request:
    branches: [Ys]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out committed Ys source
        uses: actions/checkout@v4

      - name: Verify and restore lossless evidence archives
        run: |
          python3 Ys/tools/restore_evidence_graphs.py --verify
          python3 Ys/tools/restore_evidence_graphs.py --restore

      - name: Reassemble and verify original 44-commit Git history
        shell: bash
        run: |
          python3 Ys/tools/restore_m14_git_history.py --output "$RUNNER_TEMP/Ys-M14-Foundation.bundle"
          git bundle verify "$RUNNER_TEMP/Ys-M14-Foundation.bundle"
          git clone -q -b Ys "$RUNNER_TEMP/Ys-M14-Foundation.bundle" "$RUNNER_TEMP/ys-original-history"
          test "$(git -C "$RUNNER_TEMP/ys-original-history" rev-list --count refs/heads/Ys)" -eq 44

      - name: Rebuild entire 256 KiB source-only cartridge
        working-directory: Ys
        shell: bash
        run: |
          python3 tools/build_system_m10.py --check --out "$RUNNER_TEMP/ys-rebuilt.sms"
          test "$(stat -c%s "$RUNNER_TEMP/ys-rebuilt.sms")" -eq 262144
          echo "02e9404e81bddd4ca21fef2b2711dfe562c3bd7b230bf042df3142362e29a6a9  $RUNNER_TEMP/ys-rebuilt.sms" | sha256sum -c -

      - name: Verify Milestone 14 Bank 13 asset inventory
        working-directory: Ys
        run: python3 tools/bank13_rle_m14.py --check

      - name: Verify Milestone 15 decoded graphics source
        working-directory: Ys
        run: python3 tools/bank13_semantic_source_m15.py --check

      - name: Verify Milestone 16 Bank 13 graphics consumer report
        working-directory: Ys
        run: python3 tools/bank13_vdp_consumer_m16.py --check

      - name: Run Milestone 13–16 unit regressions
        working-directory: Ys
        run: python3 -m unittest -v tests_semantic_debt_m13 tests_bank13_rle_m14 tests_bank13_semantic_source_m15 tests_bank13_vdp_consumer_m16

      - name: Ensure verification did not modify tracked sources
        run: git diff --exit-code
