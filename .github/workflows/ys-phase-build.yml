name: Ys native phase builds

on:
  push:
    branches: [Ys]
    paths:
      - 'native/**'
      - '.github/workflows/ys-phase-build.yml'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel (promotion requires verified gates)'
        type: choice
        required: true
        default: dev
        options:
          - dev
          - alpha
          - beta
          - final

permissions:
  contents: read

jobs:
  phase-package:
    name: ${{ matrix.os }} / ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'dev' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate build labels, gates, manifests and ROM exclusion
        run: python -m unittest discover -s native/tools -p "test_*.py" -v
      - name: Compile, test and package native phase
        run: python native/tools/build_phase.py --channel "${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'dev' }}"
      - name: Verify self-contained Windows graphical entry point
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Join-Path (Get-Location) 'build-native-phase/Release/ys-native-window.exe'
          if (-not (Test-Path $exe)) { throw "Windows graphical EXE is missing: $exe" }
          & $exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "Windows graphical EXE self-test failed: $LASTEXITCODE" }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          if ($bytes.Length -lt 512) { throw 'Graphical EXE is unexpectedly small' }
          $pe = [System.BitConverter]::ToInt32($bytes, 0x3C)
          $subsystem = [System.BitConverter]::ToUInt16($bytes, $pe + 24 + 68)
          if ($subsystem -ne 2) { throw "Expected Windows GUI PE subsystem 2, got $subsystem" }
          $zip = Get-ChildItem 'dist/ys-m31-dev-windows-*.zip' | Select-Object -First 1
          if (-not $zip) { throw 'Expected a versioned Windows diagnostic package' }
          Write-Host "PASS: persistent Windows GUI-subsystem binary, self-test and versioned ZIP"
      - name: Publish downloadable build for this commit
        uses: actions/upload-artifact@v4
        with:
          name: ys-native-${{ matrix.os }}-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30
      - name: Verify no tracked source changed
        run: git diff --exit-code
