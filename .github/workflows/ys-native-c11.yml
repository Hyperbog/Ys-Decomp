name: Ys native C11 boot foundation
on:
  push:
    branches: [Ys]
  pull_request:
    branches: [Ys]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-memory-and-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure C11 runtime
        run: cmake -S native -B build-native -DCMAKE_BUILD_TYPE=Debug
      - name: Compile native bus and bounded Z80
        run: cmake --build build-native --parallel
      - name: Test memory and instruction behavior
        run: ctest --test-dir build-native --output-on-failure
      - name: Reconstruct SHA-verified ROM entirely from source
        run: python3 Ys/tools/build_system_m10.py --check --out "$RUNNER_TEMP/ys-native-boot.sms"
      - name: Trace real Ys reset through first startup call
        run: ./build-native/ys-native-trace "$RUNNER_TEMP/ys-native-boot.sms"
      - name: Ensure no tracked source changed
        run: git diff --exit-code
